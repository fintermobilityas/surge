version: 2
updates:
  - package-ecosystem: nuget
    cooldown:
      default-days: 3
    directory: "/dotnet"
    schedule:
      interval: daily
      time: "04:00"

  - package-ecosystem: cargo
    cooldown:
      default-days: 3
    directory: "/"
    schedule:
      interval: daily
      time: "04:00"
    groups:
      egui-stack:
        patterns:
          - "eframe"
          - "egui"
          - "egui*"

  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 3
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
